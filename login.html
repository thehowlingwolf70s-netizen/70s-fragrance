<!DOCTYPE html>
<html>
<head>
  <title>Login — 70S Fragrance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="70S Fragrance">
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="login.html">Login</a>
      <a href="orders.html">My Orders</a>
    </nav>
  </header>

  <div class="container">
    <h1 style="text-align:center;">Login</h1>
    <div class="form-box">
      <input id="email" placeholder="Email"><br><br>
      <input id="password" type="password" placeholder="Password"><br><br>
      <button onclick="login()" style="width:100%;">Login</button>
      <p class="msg" id="msg"></p>
    </div>
  </div>

  <footer>
    <div class="footer-brand">70S Fragrance</div>
    <p>Signature scents, decanted with care.</p>
    <p style="margin-top:10px;">&copy; 2026 70S Fragrance. All rights reserved.</p>
  </footer>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      document.getElementById("msg").textContent = data.success ? "Welcome, " + data.name + "!" : data.message;
    }
  </script>
</body>
</html>
