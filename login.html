<!DOCTYPE html>
<html>
<head>
  <title>Login — 70S Fragrance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="announce-bar">Free delivery on orders over 2000 Tk</div>
  <header>
    <div class="nav-wrap">
      <img class="logo" src="logo.png" alt="70S Fragrance">
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="orders.html">My Orders</a>
      </nav>
      <div class="nav-icons">
        <a href="login.html" title="Account">&#128100;</a>
        <a href="products.html#cartBox" title="Cart">&#128717;<span class="cart-badge" id="navCartCount">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 style="text-align:center;">Login</h1>
    <div class="form-box">
      <input id="email" type="email" placeholder="Email" autocomplete="email"><br><br>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br>
      <button onclick="login()" style="width:100%;">Login</button>
      <p class="msg" id="msg"></p>
      <p style="text-align:center; font-size:0.85rem; color:#9a8974; margin-top:14px;">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </div>
  </div>

  <footer>
    <div class="footer-brand">70S Fragrance</div>
    <p>Signature scents, decanted with care.</p>
    <p style="margin-top:10px;">&copy; 2026 70S Fragrance. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    // After logging in, go back to the page the customer came from (or the shop).
    function nextPage() {
      const n = new URLSearchParams(window.location.search).get("next");
      return n && /^[a-z0-9_-]+\.html$/i.test(n) ? n : "products.html";
    }

    async function login() {
      const msg = document.getElementById("msg");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        msg.textContent = "Please type your email and password.";
        return;
      }
      msg.textContent = "Logging in...";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        msg.textContent = "Welcome, " + data.name + "!";
        window.location.href = nextPage();
      } else {
        msg.textContent = data.message;
      }
    }

    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
