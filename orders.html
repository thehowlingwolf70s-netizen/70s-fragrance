<!DOCTYPE html>
<html>
<head>
  <title>My Orders — 70S Fragrance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="announce-bar">Free delivery on orders over 2000 Tk</div>
  <header>
    <div class="nav-wrap">
      <img class="logo" src="logo.png" alt="70S Fragrance">
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="orders.html">My Orders</a>
      </nav>
      <div class="nav-icons">
        <a href="login.html" title="Account">&#128100;</a>
        <a href="products.html#cartBox" title="Cart">&#128717;<span class="cart-badge" id="navCartCount">0</span></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 style="text-align:center;">My Orders</h1>
    <div id="orderList"></div>
  </div>

  <footer>
    <div class="footer-brand">70S Fragrance</div>
    <p>Signature scents, decanted with care.</p>
    <p style="margin-top:10px;">&copy; 2026 70S Fragrance. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    async function loadOrders() {
      const res = await fetch("/api/orders");
      if (res.status === 401) {
        document.getElementById("orderList").innerHTML = "<p style='text-align:center;'>Please <a href='login.html'>log in</a> to see your orders.</p>";
        return;
      }
      const orders = await res.json();
      const container = document.getElementById("orderList");
      if (orders.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No orders yet.</p>";
        return;
      }
      let html = "";
      for (const o of orders) {
        html += `<div class="order-card">
          <h3>Order #${o.id} - ${o.total} Tk - <span class="status-${o.status}">${o.status.toUpperCase()}</span></h3>`;
        for (const item of o.items) {
          html += `<p>${item.product_name} (${item.ml}ml) - ${item.price} Tk</p>`;
        }
        html += `<p style="margin-top:12px;"><a href="receipt.html?id=${o.id}"><button>View receipt</button></a></p>
        </div>`;
      }
      container.innerHTML = html;
    }
    loadOrders();
  </script>
</body>
</html>
